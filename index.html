<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML Lab</title>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBF9;--surf:#FFFFFF;--tx:#1A1A1A;--mut:#6B6B6B;--ac:#D97706;--ac2:#059669;--hi:#7C3AED;--c2:#7C3AED;--code:#17171A;--bd:#E5E5E5;--sh:0 1px 3px rgba(0,0,0,.06);--shh:0 8px 24px rgba(0,0,0,.1);--ease:all .2s cubic-bezier(.4,0,.2,1);color-scheme:light}
:root[data-theme=dark]{--bg:#0F0F0F;--surf:#1A1A1A;--tx:#F5F5F5;--mut:#A3A3A3;--ac:#FBBF24;--ac2:#34D399;--hi:#A78BFA;--c2:#A78BFA;--code:#0A0A0A;--bd:#2A2A2A;--sh:0 1px 3px rgba(0,0,0,.4);--shh:0 8px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.7 'Inter',system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] textarea{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif}
code,pre,.mono,.fm,.ce,.out{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;background:var(--ac);transition:width .15s}
header{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surf);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;font-size:1.15rem;letter-spacing:-.03em;margin-inline-end:12px;white-space:nowrap}.logo b{color:var(--ac)}
.ib{background:var(--surf);border:1px solid var(--bd);border-radius:999px;min-width:38px;min-height:38px;padding:0 12px;transition:var(--ease)}.ib:hover{border-color:var(--ac);background:var(--bg)}
#q{flex:1;max-width:420px;margin-inline:auto;padding:8px 16px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit;transition:var(--ease)}#q:focus{border-color:var(--ac);outline:0}
#wrap{flex:1;display:flex;min-height:0}
nav{width:288px;flex-shrink:0;overflow-y:auto;padding:16px 12px;border-inline-end:1px solid var(--bd);background:var(--surf)}
nav .it{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:8px 12px;transition:var(--ease);font-size:.93rem}
nav .it:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
nav .it.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);font-weight:600}
nav .grp{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 12px 6px}
nav .lh{font-weight:500}nav .lh.open{font-weight:600}nav .lh small{margin-inline-start:auto;color:var(--mut);font-size:.75rem}
.chev{display:inline-block;width:14px;transition:transform .2s cubic-bezier(.4,0,.2,1);color:var(--mut)}.open .chev{transform:rotate(90deg)}[dir=rtl] .chev{transform:scaleX(-1)}[dir=rtl] .open .chev{transform:scaleX(-1) rotate(90deg)}
nav .sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s cubic-bezier(.4,0,.2,1)}nav .open+.sub{grid-template-rows:1fr}
nav .sub>div{overflow:hidden;margin-inline-start:18px;border-inline-start:1px solid var(--bd);padding-inline-start:6px}
nav .done::after{content:"✓";margin-inline-start:auto;color:var(--ac2);font-weight:700}
.pg{margin:20px 12px 0;font-size:.8rem;color:var(--mut)}.bar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2);border-radius:3px;transition:width .3s}
main{flex:1;overflow-y:auto;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 220px;column-gap:40px;align-content:start;padding:24px clamp(18px,4vw,56px) 64px;scroll-behavior:smooth}
main:focus{outline:0}
#bc{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.85rem;color:var(--mut);margin-bottom:28px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
#bc a{color:var(--mut);text-decoration:none}#bc a:hover{color:var(--ac)}#bc .cur{color:var(--tx);font-weight:500}#bc .sep{margin:0 6px;opacity:.5}
.rt{white-space:nowrap;background:var(--surf);border:1px solid var(--bd);border-radius:999px;padding:2px 12px;font-size:.8rem}
article{grid-column:1;max-width:900px;min-width:0}
#toc{grid-column:2;grid-row:2;align-self:start;position:sticky;top:0;font-size:.85rem;display:flex;flex-direction:column;gap:2px;border-inline-start:1px solid var(--bd);padding-inline-start:16px}#toc:empty{display:none}
#toc b{margin-bottom:8px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}#toc a{color:var(--mut);text-decoration:none;padding:3px 0;transition:var(--ease)}#toc a:hover{color:var(--tx)}#toc a.on{color:var(--ac);font-weight:600}
h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15;letter-spacing:-.03em;font-weight:700;margin:0 0 12px}
h2{font-size:1.35rem;letter-spacing:-.02em;font-weight:650;margin:48px 0 16px;scroll-margin-top:16px}p{margin:0 0 20px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:24px;margin:16px 0;box-shadow:var(--sh);transition:var(--ease)}.card:hover{transform:translateY(-2px);box-shadow:var(--shh)}
.ph{border:2px dashed var(--bd);border-radius:16px;padding:24px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin:16px 0}.grid .card{margin:0}
.lc{text-align:start;background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:var(--sh);transition:var(--ease);display:flex;flex-direction:column;gap:6px}.lc:hover{transform:translateY(-3px);box-shadow:var(--shh);border-color:var(--ac)}
.lc .n{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}.lc b{font-size:1.05rem;line-height:1.35}.lc small{color:var(--mut)}.lc .bar{margin-top:8px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:40px}
.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,var(--c2)));color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:600;text-decoration:none;display:inline-block;transition:var(--ease)}.btn:hover{transform:translateY(-1px);box-shadow:var(--shh)}
:root[data-theme=dark] .btn{color:#0F0F0F}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}:root[data-theme=dark] .btn.o{color:var(--tx)}.btn.o:hover{border-color:var(--ac);box-shadow:none}
.btn.g{background:none;color:var(--mut);border:0}
.hero{padding:16px 0 8px}.eyebrow{display:inline-block;font-weight:600;color:var(--ac);margin-bottom:12px}.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);max-width:18ch}.hero>p{color:var(--mut);font-size:1.15rem;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}.pill{display:inline-block;padding:6px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--surf);font-size:.88rem;font-weight:500;transition:var(--ease)}button.pill:hover{border-color:var(--ac);color:var(--ac)}
.cont{max-width:520px;border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}.cont small{color:var(--mut)}
.dev{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px}@media(max-width:800px){.dev{grid-template-columns:1fr}}
.dc{text-align:center}.av{width:150px;height:150px;border-radius:50%;margin:0 auto 16px;overflow:hidden;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:2.6rem;font-weight:700}.av img{width:100%;height:100%;object-fit:cover}.dc hr{border:0;border-top:1px solid var(--bd);width:60%;margin:12px auto}
.cts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}@media(max-width:600px){.cts{grid-template-columns:1fr}}
.cc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px;border:1px solid var(--bd);border-radius:16px;background:var(--surf);color:var(--tx);text-decoration:none;box-shadow:var(--sh);transition:var(--ease);font-weight:500}.cc span{font-size:1.6rem}.cc:hover{transform:translateY(-3px);box-shadow:var(--shh);border-color:var(--ac)}
.ct input,.ct textarea{width:100%;margin:6px 0;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.fm{font-size:1rem;background:var(--code);color:#f3f3f3;border-radius:16px;padding:20px 24px;margin:16px 0;overflow-x:auto;white-space:pre}.fm small{display:block;color:var(--ac);font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;white-space:normal}.fm .kx{display:block;font-size:1.15rem;white-space:normal;margin:4px 0}
.tag{display:inline-block;border:1px solid var(--ac2);color:var(--ac2);border-radius:999px;padding:1px 12px;font-size:.78rem;font-weight:600}
table.t{border-collapse:collapse;width:100%;margin:16px 0}table.t td,table.t th{padding:10px 14px;border-bottom:1px solid var(--bd);text-align:start}table.t th{font-size:.8rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
canvas{width:100%;max-width:480px;border-radius:16px;border:1px solid var(--bd);background:var(--surf);touch-action:none}input[type=range]{accent-color:var(--ac)}
.qo{display:block;width:100%;text-align:start;margin:8px 0;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);transition:var(--ease)}.qo:hover{border-color:var(--ac)}.qo.ok{background:color-mix(in srgb,var(--ac2) 18%,transparent);border-color:var(--ac2)}.qo.no{background:color-mix(in srgb,#e11d48 14%,transparent);border-color:#e11d48}
.ce{width:100%;min-height:200px;background:var(--code);color:#e8e8e8;border:0;border-radius:12px;padding:14px;font-size:13.5px;line-height:1.6;resize:vertical;tab-size:4}
.out{background:var(--code);color:#7ee0a8;border-radius:12px;padding:14px;margin:0;min-height:200px;white-space:pre-wrap;font-size:.88rem;overflow:auto}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.split h4{margin:0 0 8px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.split .tb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:900px){.split{grid-template-columns:1fr}}
abbr{text-decoration:underline dotted var(--ac);text-underline-offset:3px;cursor:help}mark{background:color-mix(in srgb,var(--ac) 30%,transparent);color:inherit;border-radius:3px}
.hit{display:block;width:100%;text-align:start;background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:8px 0;transition:var(--ease)}.hit:hover{border-color:var(--ac)}
.rel{margin-top:48px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rel b{margin-inline-end:8px;color:var(--mut);font-size:.85rem}
.float{position:fixed;z-index:0;font-size:1.6rem;opacity:.1;pointer-events:none;top:0;animation:fl linear infinite}@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}#view.in{animation:fadeInUp .3s cubic-bezier(.4,0,.2,1) both}
footer{padding:6px 20px;background:var(--surf);color:var(--mut);border-top:1px solid var(--bd);font-size:.8rem;display:flex;justify-content:space-between}

@media(max-width:1100px){main{display:block}#toc{display:none}}
@media(max-width:800px){#burger{display:inline-block}header{padding:8px 12px;gap:6px}#print{display:none}nav{position:fixed;inset-block:0;inset-inline-start:0;z-index:20;top:58px;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shh)}[dir=rtl] nav{transform:translateX(100%)}nav.show{transform:none}}
@media print{header,nav,footer,.pn,#bar,.float,#toc,.rel{display:none}body{overflow:visible;display:block}main{overflow:visible;display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== desktop layout ===== */
#burger{display:inline-flex;align-items:center}
body.nonav nav{display:none}
main{padding-inline:max(24px,calc((100% - 1240px)/2))}
main.wide{grid-template-columns:minmax(0,1fr)}main.wide article{max-width:none}main.wide.nh article{max-width:920px}
nav .lh span:nth-child(2){line-height:1.35}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:24px 0 8px}@media(max-width:900px){.hero{grid-template-columns:1fr;gap:16px}}
.hero h1{max-width:20ch;font-size:clamp(2rem,3.8vw,3.1rem)}
.net{width:100%;max-width:440px;justify-self:center}.net line{stroke:var(--ac);stroke-opacity:.3;stroke-width:1.5;stroke-dasharray:4 6;animation:dash 6s linear infinite}@keyframes dash{to{stroke-dashoffset:-100}}
.net circle{fill:var(--ac);transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}.net circle:nth-of-type(3n){fill:var(--ac2)}.net circle:nth-of-type(3n+1){fill:var(--hi)}@keyframes pulse{50%{transform:scale(1.28)}}
.g5{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.grid .lc{animation:fadeInUp .45s both}.grid .lc:nth-child(2){animation-delay:.06s}.grid .lc:nth-child(3){animation-delay:.12s}.grid .lc:nth-child(4){animation-delay:.18s}.grid .lc:nth-child(5){animation-delay:.24s}
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}.rv.on{opacity:1;transform:none}
.btn:active{transform:scale(.97)}
/* ===== stats ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin:32px 0 0}
.stat{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:18px 20px;box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;transition:var(--ease)}.stat:hover{transform:translateY(-3px);box-shadow:var(--shh)}
.stat span{flex-basis:100%;font-size:1.4rem;margin-bottom:4px}.stat b{font-size:1.6rem;line-height:1.1;display:inline}.stat i{font-style:normal;color:var(--mut);font-size:.85rem}.stat small{flex-basis:100%;color:var(--mut);font-size:.78rem}

/* ===== header / bc extras ===== */
header .hm{font-size:.85rem;padding:0 10px}#pom.run{border-color:var(--ac2);color:var(--ac2)}
#bc .bt{margin-inline-start:auto;display:flex;gap:6px}#bc .bt .ib{min-width:32px;min-height:32px;padding:0 8px}
@media(max-width:1000px){header .hm{display:none}}
.cpb{position:absolute;top:10px;inset-inline-end:10px;background:rgba(255,255,255,.1);border:0;color:#ddd;border-radius:8px;width:30px;height:30px;opacity:0;transition:var(--ease)}.fm{position:relative}.fm:hover .cpb{opacity:1}
body.focus nav,body.focus #toc,body.focus footer{display:none}body.focus main{padding-inline:max(24px,calc((100% - 820px)/2))}body.focus main{grid-template-columns:minmax(0,1fr)}
/* ===== overlays ===== */
#pal,.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;animation:fadeInUp .2s both}
.pb{width:min(640px,92vw);background:var(--surf);border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:16px;max-height:76vh;overflow:auto}
#pi{width:100%;padding:12px 16px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:1.05rem}#pi:focus{outline:0;border-color:var(--ac)}
#pal .chips{margin:12px 0 8px}.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}:root[data-theme=dark] .pill.on{color:#0F0F0F}
.pit{display:block;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:10px 12px}.pit.on,.pit:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}.pit small{display:block;color:var(--mut);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pe{color:var(--mut);padding:12px}
.kr{display:flex;justify-content:space-between;gap:16px;padding:8px 4px;border-bottom:1px solid var(--bd)}kbd{font-family:'JetBrains Mono',monospace;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:1px 8px;font-size:.82rem}
#fx{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,92vw);z-index:55;background:var(--surf);border-inline-start:1px solid var(--bd);box-shadow:var(--shh);padding:16px;overflow:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1)}[dir=rtl] #fx{transform:translateX(-100%)}#fx.on{transform:none}
#fx .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}#fx input{width:100%;padding:8px 14px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:12px}
.fi{position:relative;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 44px 10px 14px;margin-bottom:8px}.fi small{display:block;color:var(--ac);font-size:.72rem;font-weight:600}.fi code{display:block;white-space:pre-wrap;font-size:.85rem}.fi .ib{position:absolute;top:8px;inset-inline-end:8px;min-width:30px;min-height:30px;padding:0}
#np{position:fixed;bottom:20px;inset-inline-end:20px;width:min(340px,90vw);z-index:50;background:var(--surf);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--shh);padding:14px;animation:fadeInUp .2s both}#np textarea{width:100%;height:160px;margin:8px 0 4px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical}#np small{color:var(--mut)}
.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:.9rem;z-index:80;opacity:0;transition:all .3s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;inset:0;z-index:90;pointer-events:none}
.btt{position:fixed;bottom:24px;inset-inline-start:24px;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--surf);box-shadow:var(--shh);opacity:0;pointer-events:none;transform:translateY(10px);transition:var(--ease);z-index:40}.btt.show{opacity:1;pointer-events:auto;transform:none}.btt:hover{border-color:var(--ac);color:var(--ac)}
/* ===== code highlight ===== */
.cw{position:relative}.cw pre.hl,.cw .ce{margin:0;padding:14px;font:13.5px/21.6px 'JetBrains Mono',monospace;white-space:pre;overflow:auto;border-radius:12px;width:100%;min-height:220px;tab-size:4}
.cw pre.hl{position:absolute;inset:0;background:var(--code);color:#e8e8e8;pointer-events:none}.cw .ce{position:relative;background:transparent;color:transparent;caret-color:#fff;resize:none;display:block}
.hl i{font-style:normal}.hl .k{color:#c792ea}.hl .s{color:#c3e88d}.hl .c{color:#7a8290;font-style:italic}.hl .n{color:#f78c6c}.hl .b{color:#82aaff}
/* ===== flashcards ===== */
.fcard{min-height:200px;display:grid;place-items:center;text-align:center;font-size:1.3rem;font-weight:600;padding:32px;border:1px solid var(--bd);border-radius:20px;background:var(--surf);box-shadow:var(--shh);cursor:pointer;transition:var(--ease);position:relative}.fcard small{position:absolute;bottom:12px;color:var(--mut);font-size:.8rem;font-weight:400}.fcard.flip{background:color-mix(in srgb,var(--ac) 10%,var(--surf));font-weight:400;font-size:1.1rem}.fc .tb{display:flex;gap:8px;justify-content:center;margin-top:16px}
@media(max-width:800px){.btt{bottom:16px}.hero h1{font-size:2rem}}
@media print{.btt,#np,#fx,.toast,.cf{display:none}}

#sb{display:flex;gap:6px;padding:8px 20px;background:var(--surf);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}#sb::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:1px solid transparent;border-radius:999px;padding:6px 16px;font-size:.9rem;font-weight:500;color:var(--mut);transition:var(--ease);white-space:nowrap}.tab:hover{color:var(--tx);background:var(--bg)}.tab.on{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,transparent);font-weight:600}
body.focus #sb{display:none}@media print{#sb{display:none}}

["Which problem type predicts a continuous value?",["Classification","Regression","Clustering"],1],

const QZ2=[["Which split does a greedy decision tree pick?",["The one with the lowest information gain","The one with the highest information gain","A random one"],1],
["Entropy of a perfectly pure set (all one class) is...",["0","0.5","1"],0],
["Entropy is largest for a binary label when p equals...",["0","0.5","1"],1],
["Why is tree construction greedy?",["Finding the optimal tree is NP-hard","Trees cannot be pruned","Data is always sorted"],0]];
function body2(s){
 if(s==="theory")return `<h2>Lemons or oranges?</h2><p>Given measurements such as height and width, a tree asks a sequence of simple questions to decide the fruit.</p>
<h2>Tree structure</h2><div class="grid"><div class="card"><span class="tag">Internal node</span><br>Tests one feature.</div><div class="card"><span class="tag">Branch</span><br>One outcome of the test.</div><div class="card"><span class="tag">Leaf</span><br>Holds the prediction.</div></div>
<p><b>Classification trees</b> predict a class; <b>regression trees</b> predict a number. Continuous features use a threshold (x ≤ c); discrete features branch per value.</p>
<h2>Learning a tree</h2><ul><li>Finding the smallest optimal tree is <b>NP-hard</b>.</li><li>So we use a greedy heuristic: pick the best split now, then recurse on each child.</li><li>This is hill climbing with no backtracking, so it can end in a locally good tree.</li></ul>
<p>A good split makes the child sets purer, which we measure with entropy.</p>`;
 if(s==="formulas")return F("Entropy","H(Y) = − Σ p(y) log₂ p(y)")+F("Information gain","Gain(S,a) = Entropy(S) − Σ (|Sᵥ| / |S|) · Entropy(Sᵥ)");
 if(s==="examples")return `<h2>Tennis dataset (14 examples)</h2><div class="card">9 Yes, 5 No<br>Entropy(Play) = −(9/14)log₂(9/14) − (5/14)log₂(5/14) = <b>0.940</b></div>
<p>Outlook splits into Sunny (2 Yes, 3 No: 0.971), Overcast (4 Yes: 0) and Rain (3 Yes, 2 No: 0.971):<br>Gain(Outlook) = 0.940 − (5/14)(0.971) − (4/14)(0) − (5/14)(0.971) = <b>0.246</b></p>
<table class="t"><tr><th>Feature</th><th>Information gain</th></tr><tr><td>Outlook</td><td>0.246</td></tr><tr><td>Humidity</td><td>0.151</td></tr><tr><td>Wind</td><td>0.048</td></tr><tr><td>Temperature</td><td>0.029</td></tr></table><p>Outlook has the highest gain, so the root splits on <b>Outlook</b>.</p><p><small>Note: computed exactly, Outlook is 0.247 and Humidity is 0.152. The lecture's 0.246 and 0.151 come from rounding the intermediate entropies. The ranking is the same.</small></p>
<h2>Split A vs Split B</h2><p>With H(Y) = 0.86: Split A gives IG ≈ 0.17 and Split B gives IG ≈ 0.006. Pick Split A.</p><h2>Restaurant tree: will I eat here?</h2><p>A tree with discrete features, as drawn on the lecture slide (F = no, T = yes). The full tree is drawn above in the theory section.</p><p>Each internal node splits one discrete feature into one branch per value, and each leaf holds the prediction.</p>`;
 if(s==="demos")return `<h2>Entropy Calculator</h2><p>Binary label with P(yes) = <b id="pv">0.50</b></p><input type="range" id="ep" min="0" max="100" value="50" aria-label="p" style="width:100%;max-width:480px"><div class="fm"><small>H(Y) in bits</small><span id="hv">1.000</span></div><h2>Information Gain Explorer (Tennis)</h2><p>Feature <select id="ig" aria-label="feature">${["Outlook","Temperature","Humidity","Wind"].map(f=>`<option>${f}</option>`).join("")}</select></p><div id="igo"></div><h2>Tree Builder</h2><p>Press Step to expand one node at a time, always splitting on the feature with the highest information gain.</p><p><button class="btn o" id="tb">Step</button> <button class="btn o" id="tr">Reset</button></p><pre class="out" id="tbo"></pre>`;
 if(s==="quiz")return QH(QZ2);
 return "";
}
const QZ3=[["In y = β0 + β1x, what does β1 represent?",["The intercept","The slope","The residual"],1],
["Least squares chooses the line that minimizes...",["Sum of residuals","Sum of squared residuals","Largest residual"],1],
["In gradient descent, a learning rate that is too large can...",["Diverge","Converge faster always","Do nothing"],0],
["Why vectorize with a design matrix?",["Shorter, faster code than loops","It changes the model","It removes the bias"],0]];
function body3(s){
 if(s==="theory")return `<h2>Simple linear regression</h2><p>Model one output as a straight-line function of one input: Y = β0 + β1X. We want the line that best matches the data.</p>
<h2>Least squares</h2><p>A <b>residual</b> is the gap between an observed value and the line's prediction. Least squares picks β0 and β1 that minimize the sum of squared residuals.</p>
<h2>Vectorization</h2><p>Stack inputs into a <b>design matrix</b> X (one row per example, with a column of ones for the bias) and write predictions as y = Xw. Benefits: shorter code, no Python loops, and fast optimized linear algebra.</p>
<h2>Fitting by gradient descent</h2><p>Start with w = 0 and repeatedly move against the gradient of the cost until it stops improving.</p>`;
 if(s==="formulas")return F("Model","Y = β0 + β1X")+F("Slope and intercept","β1 = SS_xy / SS_x\nβ0 = ȳ − β1·x̄")+F("Sums of squares","SS_x  = Σ(xᵢ − x̄)² = Σxᵢ² − (Σxᵢ)²/n\nSS_xy = Σ(xᵢ − x̄)(yᵢ − ȳ) = Σxᵢyᵢ − (Σxᵢ)(Σyᵢ)/n")+F("Loss and cost","L(y,t) = ½(y − t)²\nJ(w,b) = 1/(2N) Σ (y⁽ⁱ⁾ − t⁽ⁱ⁾)²")+F("Gradient descent update","w ← w − (α/N) Σ (y⁽ⁱ⁾ − t⁽ⁱ⁾) x⁽ⁱ⁾");
 if(s==="examples")return `<h2>Education vs income (n = 10)</h2><div class="card">Σx = 118, Σx² = 1450, Σy = 302, Σy² = 10072, Σxy = 3779</div>
<p>SS_x = 1450 − 118²/10 = <b>57.6</b><br>SS_xy = 3779 − (118)(302)/10 = <b>215.4</b><br>β1 = 215.4 / 57.6 = <b>3.74</b><br>β0 = 30.2 − 3.74 × 11.8 = <b>−13.93</b></p>${F("Fitted line","y = −13.93 + 3.74x")}<p>Each extra year of education adds about 3.74 units of income.</p><h2>Car age vs speed (13 cars)</h2><div class="card">x (age) = [5,7,8,7,2,17,2,9,4,11,12,9,6]<br>y (speed) = [99,86,87,88,111,86,103,87,94,78,77,85,86]</div><p>Σx = 99, Σy = 1167, SS_x ≈ 209.08, SS_xy ≈ −366.15<br>β1 ≈ <b>−1.75</b>, β0 ≈ <b>103.11</b>, correlation r ≈ −0.76</p>${F("Fitted line (same result as scipy.stats.linregress)","speed = 103.11 − 1.75 · age")}<p>Older cars are slower: each extra year of age lowers the predicted speed by about 1.75. For a 10-year-old car the prediction is about 85.6. (The slide prints std_err under the name "loss"; std_err is the standard error of the slope, not the loss.)</p>`;
 if(s==="demos")return `<h2>Regression Playground</h2><p>Tap to add points. The solid line is the exact least-squares fit; the dashed line is gradient descent, which you advance yourself.</p><p>α = <b id="lv">0.10</b> <input type="range" id="lr" min="1" max="300" value="10" aria-label="learning rate"> <button class="btn o" id="gs">Step ×10</button> <button class="btn o" id="gr">Reset GD</button> <button class="btn o" id="gc">Clear points</button></p><canvas id="lp" width="480" height="320" aria-label="Regression canvas"></canvas><p class="mono" id="gj"></p>`;
 if(s==="quiz")return QH(QZ3);
 return "";
}
const QZ4=[["A model with low bias and high variance is...",["Overfitting","Underfitting","Ideal"],0],
["What does bagging do?",["Trains models on bootstrap samples and averages them","Removes features","Increases the learning rate"],0],
["What extra randomness do random forests add to bagging?",["Random labels","Random subset of features at each split","Random k"],1],
["Which learning rate is in the usual safe range?",["0.05","50","5000"],0]];
function body4(s){
 if(s==="theory")return `<h2>Bias and variance</h2><p><b>Bias</b> is how far the average prediction is from the truth. <b>Variance</b> is how much predictions change when the training set changes.</p>
<table class="t"><tr><th>Bias</th><th>Variance</th><th>Result</th></tr><tr><td>Low</td><td>Low</td><td>Ideal</td></tr><tr><td>Low</td><td>High</td><td>Overfitting</td></tr><tr><td>High</td><td>Low</td><td>Underfitting</td></tr><tr><td>High</td><td>High</td><td>Worst case</td></tr></table>
<h2>Ensembles</h2><p>Combine many weak learners into one stronger learner. Averaging models whose errors are not perfectly correlated lowers variance.</p>
<h2>Bagging (bootstrap aggregating)</h2><ol><li>Draw m bootstrap datasets by sampling the training set with replacement.</li><li>Train one model on each.</li><li>Average the predictions, or take a majority vote for classification.</li></ol>
<h2>Random forests</h2><p>Bagged decision trees where each split considers only a random subset of features (feature bagging, or the random subspace method). This makes the trees less alike, so averaging helps more.</p>
<h2>Optimization</h2><p>Gradient descent repeats wⱼ → wⱼ − α ∂J/∂wⱼ. A tiny α is slow; a large α can overshoot and diverge.</p>`;
 if(s==="formulas")return F("Bias","Bias = E[ŷ] − y_true")+F("Variance","Variance = E[(ŷ − E[ŷ])²]")+F("Gradient descent","wⱼ → wⱼ − α ∂J/∂wⱼ")+F("Typical learning rate","α ∈ [0.001, 0.1]");
 if(s==="examples")return `<h2>Bagging: m = 3 datasets, n = 7 examples</h2><p>Each dataset is built by drawing 7 examples from the 7 originals with replacement, so some repeat and some are left out.</p><div class="card">P(a given example is never drawn) = (1 − 1/7)⁷ = (6/7)⁷ ≈ <b>0.34</b></div><p>So each bootstrap set contains roughly 66% of the distinct original examples. The 3 models see different data, and their votes are combined.</p><h2>Reading the four cases</h2><p>Low bias, low variance is the target. Low bias with high variance means the model chases noise. High bias with low variance means it is too simple. High bias with high variance is wrong and unstable.</p>`;
 if(s==="demos")return `<h2>Polynomial Regression Explorer</h2><p>Fit a polynomial of degree M to 10 noisy points of a smooth curve. M = 0 or 1 underfits (high bias); M = 9 passes through every point but wiggles (high variance).</p><p>M = <b id="pmv">3</b> <input type="range" id="pm" min="0" max="9" value="3" aria-label="degree M"></p><canvas id="pd" width="480" height="320" aria-label="Polynomial fit"></canvas><p class="mono" id="pe"></p><h2>Bagging Demo</h2><p>Seven labelled examples (labels 0,0,1,1,1,0,1). Each of 3 models trains on a bootstrap sample and predicts its majority label; the ensemble takes a vote.</p><p><button class="btn o" id="bg">Draw new samples</button></p><pre class="out" id="bgo"></pre>`;
 if(s==="quiz")return QH(QZ4);
 return "";
}
const QZ5=[["A function f is convex if...",["f of a mixture is at most the mixture of f values","It has many local minima","It is always linear"],0],
["For a convex cost, every local minimum is...",["A saddle point","A global minimum","A maximum"],1],
["sigmoid(0) equals...",["0","0.5","1"],1],
["Why use cross-entropy instead of squared error with a sigmoid?",["It gives a convex cost and a clean gradient","It is slower","It needs no labels"],0]];
function body5(s){
 if(s==="theory")return `<h2>Convexity</h2><p>A set is convex if the segment between any two of its points stays inside it. A function is convex if the segment between two points on its graph lies on or above the graph. For convex costs, every critical point that is a local minimum is also the global minimum, so gradient descent cannot get stuck in a bad one.</p>
<h2>Binary linear classification</h2><p>Compute z = wᵀx + b and predict 1 if z ≥ 0, else 0. The boundary wᵀx + b = 0 is a line (or hyperplane). The bias b can be folded into w by adding a constant input 1, written w₀.</p>
<h2>Logistic regression</h2><p>Squash z with the sigmoid so the output is a probability in (0, 1), and train with cross-entropy loss. Variants: <b>binomial</b> (2 classes), <b>multinomial</b> (many unordered classes), <b>ordinal</b> (ordered classes).</p>
<h2>Data space vs weight space</h2><p>In data space each point is an example and the boundary is a line. In weight space each point is a weight vector, and each example becomes a constraint (a half-space) on it.</p>`;
 if(s==="formulas")return F("Convexity","f((1−λ)x₀ + λx₁) ≤ (1−λ)f(x₀) + λf(x₁)")+F("Linear classifier","z = wᵀx + b\ny = 1 if z ≥ 0, else 0")+F("Sigmoid","σ(z) = 1 / (1 + e⁻ᶻ)")+F("Cross-entropy","L(y,t) = −t·log(y) − (1−t)·log(1−y)")+F("Gradient","∂J/∂wⱼ = (y − t)·xⱼ");
 if(s==="examples")return `<h2>Modeling NOT</h2><p>Inputs x₁ → output t: 0 → 1 and 1 → 0, with z = w₀ + w₁x₁.</p>${F("Constraints","w₀ ≥ 0\nw₀ + w₁ < 0")}<p>For example w₀ = 1, w₁ = −2 satisfies both.</p>
<h2>Modeling AND</h2>${F("Constraints, z = w₀ + w₁x₁ + w₂x₂","(0,0): w₀ < 0\n(0,1): w₀ + w₂ < 0\n(1,0): w₀ + w₁ < 0\n(1,1): w₀ + w₁ + w₂ ≥ 0")}<p>A solution: <b>w₀ = −1.5, w₁ = 1, w₂ = 1</b>. Check: (1,1) gives 0.5 ≥ 0; (1,0) and (0,1) give −0.5 < 0; (0,0) gives −1.5 < 0.</p>${F("Decision boundary","−1.5 + x₁ + x₂ = 0")}`;
 if(s==="demos")return `<h2>Sigmoid Visualizer</h2><p>Scale w = <b id="swv">1.0</b> <input type="range" id="sw" min="-60" max="60" value="10" aria-label="w"> bias b = <b id="sbv">0.0</b> <input type="range" id="sb" min="-60" max="60" value="0" aria-label="b"></p><canvas id="sg" width="480" height="320" aria-label="Sigmoid curve"></canvas><p>Larger |w| makes the curve steeper; b shifts the point where σ = 0.5.</p><h2>Data space and weight space</h2><p>The AND problem with z = w₀ + w₁x₁ + w₂x₂. Move the sliders, then toggle the view. In weight space, the green area is where all four examples are classified correctly for the chosen w₀.</p><p>w₀ <input type="range" id="w0" min="-30" max="30" value="0" aria-label="w0"> w₁ <input type="range" id="w1" min="-30" max="30" value="10" aria-label="w1"> w₂ <input type="range" id="w2" min="-30" max="30" value="10" aria-label="w2"> <button class="btn o" id="dt">Show weight space</button></p><canvas id="ds" width="480" height="320" aria-label="Data or weight space"></canvas><p class="mono" id="dso"></p>`;
 if(s==="quiz")return QH(QZ5);
 return "";
}

const AR={"1theory":`<h2>يعني إيه Machine Learning؟</h2><div class="card">تعريف Tom Mitchell: البرنامج بيتعلم من خبرة <b>E</b> في مهمة <b>T</b> بمقياس أداء <b>P</b>، لو أداؤه في T (مقاس بـ P) بيتحسن كل ما الخبرة E تزيد.</div>
<h2>أنواع التعلم</h2><div class="grid"><div class="card"><span class="tag">Supervised</span><br>تعلّم من أمثلة ليها labels على شكل (x, t).</div><div class="card"><span class="tag">Unsupervised</span><br>اكتشاف الأنماط في بيانات من غير labels.</div><div class="card"><span class="tag">Reinforcement</span><br>تعلّم بالمكافآت من خلال التفاعل مع بيئة.</div></div>
<p>أمثلة على الاستخدام: Computer Vision وNLP والتجارة الإلكترونية وأنظمة التوصية.</p>
<h2>إعداد الـ Supervised Learning</h2><p>مجموعة التدريب {(x⁽ⁱ⁾, t⁽ⁱ⁾)} حيث i = 1..N. في الـ <b>Regression</b> القيمة t متصلة. في الـ <b>Classification</b> القيمة t كلاس منفصل.</p>
<h2>خوارزمية K-Nearest Neighbors</h2><ol><li>دوّر على أقرب k نقطة من نقطة الاستعلام x.</li><li>اختار الكلاس الأكثر تكراراً بينهم (majority vote).</li></ol><p>الـ decision boundary بيقسم الفراغ لمناطق، ومع k=1 بيمشي على شكل Voronoi diagram لنقط التدريب.</p>
<h2>مشاكل لازم تاخد بالك منها</h2><ul><li><b>Curse of dimensionality:</b> كل ما الأبعاد تزيد البيانات بتبقى متباعدة والمسافات بتقرب من بعض.</li><li><b>Feature scaling:</b> وحّد كل feature بمتوسط صفر وانحراف معياري 1.</li><li><b>التكلفة:</b> O(ND) لكل استعلام، زائد O(N log N) للترتيب.</li></ul>`,

Object.assign(AR,{"2theory":`<h2>ليمون ولا برتقان؟</h2><p>لو عندنا قياسات زي الطول والعرض، الشجرة بتسأل سلسلة أسئلة بسيطة عشان تحدد نوع الفاكهة.</p>
<h2>هيكل الشجرة</h2><div class="grid"><div class="card"><span class="tag">Internal node</span><br>بيختبر feature واحد.</div><div class="card"><span class="tag">Branch</span><br>نتيجة واحدة من الاختبار.</div><div class="card"><span class="tag">Leaf</span><br>فيها التوقع النهائي.</div></div>

<h2>إزاي بنبني الشجرة</h2><ul><li>إيجاد أصغر شجرة مثالية مسألة <b>NP-hard</b>.</li><li>فبنستخدم طريقة greedy: نختار أحسن تقسيم دلوقتي ونكرر على كل فرع.</li><li>ده زي hill climbing من غير backtracking، فممكن نوصل لشجرة كويسة محلياً بس.</li></ul>

"2examples":`<h2>بيانات Tennis (14 مثال)</h2><div class="card">9 Yes و5 No<br>Entropy(Play) = −(9/14)log₂(9/14) − (5/14)log₂(5/14) = <b>0.940</b></div>

<table class="t"><tr><th>الـ Feature</th><th>Information gain</th></tr><tr><td>Outlook</td><td>0.246</td></tr><tr><td>Humidity</td><td>0.151</td></tr><tr><td>Wind</td><td>0.048</td></tr><tr><td>Temperature</td><td>0.029</td></tr></table><p>الـ Outlook أعلى gain، فالجذر بيتقسم على <b>Outlook</b>.</p><p><small>ملاحظة: بالحساب الدقيق بتبقى Outlook = 0.247 وHumidity = 0.152. أرقام المحاضرة (0.246 و 0.151) ناتجة من تقريب قيم الـ entropy المتوسطة. الترتيب نفسه.</small></p>
<h2>Split A مقابل Split B</h2><p>مع H(Y) = 0.86: الـ Split A بيدي IG ≈ 0.17 والـ Split B بيدي IG ≈ 0.006. نختار Split A.</p><h2>شجرة Restaurant: هأكل هنا؟</h2><p>شجرة بـ features منفصلة زي المرسومة في شريحة المحاضرة (F = لا، T = نعم). الشجرة الكاملة مرسومة فوق في قسم الشرح.</p><p>كل عقدة داخلية بتقسم feature منفصل لفرع لكل قيمة، وكل leaf فيها التوقع.</p>`,

Object.assign(AR,{"3theory":`<h2>الانحدار الخطي البسيط</h2><p>بنمثل المخرج كدالة خط مستقيم في مدخل واحد: Y = β0 + β1X. المطلوب الخط الأقرب للبيانات.</p>
<h2>طريقة Least Squares</h2><p>الـ <b>Residual</b> هو الفرق بين القيمة الملاحظة وتوقع الخط. الـ Least Squares بتختار β0 وβ1 اللي بيخلوا مجموع مربعات الـ residuals أقل ما يمكن.</p>
<h2>الـ Vectorization</h2><p>بنرص المدخلات في <b>design matrix</b> اسمها X (صف لكل مثال، وعمود أحد 1 للـ bias) ونكتب التوقعات y = Xw. الفوائد: كود أقصر، من غير loops، وجبر خطي محسّن وأسرع.</p>
<h2>التدريب بـ Gradient Descent</h2><p>بنبدأ بـ w = 0 ونتحرك عكس الـ gradient للـ cost لحد ما يوقف يتحسن.</p>`,
"3formulas":F("النموذج","Y = β0 + β1X")+F("الميل والمقطع","β1 = SS_xy / SS_x\nβ0 = ȳ − β1·x̄")+F("مجاميع المربعات","SS_x  = Σ(xᵢ − x̄)² = Σxᵢ² − (Σxᵢ)²/n\nSS_xy = Σ(xᵢ − x̄)(yᵢ − ȳ) = Σxᵢyᵢ − (Σxᵢ)(Σyᵢ)/n")+F("Loss وCost","L(y,t) = ½(y − t)²\nJ(w,b) = 1/(2N) Σ (y⁽ⁱ⁾ − t⁽ⁱ⁾)²")+F("تحديث Gradient Descent","w ← w − (α/N) Σ (y⁽ⁱ⁾ − t⁽ⁱ⁾) x⁽ⁱ⁾"),
"3examples":`<h2>التعليم مقابل الدخل (n = 10)</h2><div class="card">Σx = 118, Σx² = 1450, Σy = 302, Σy² = 10072, Σxy = 3779</div>
<p>SS_x = 1450 − 118²/10 = <b>57.6</b><br>SS_xy = 3779 − (118)(302)/10 = <b>215.4</b><br>β1 = 215.4 / 57.6 = <b>3.74</b><br>β0 = 30.2 − 3.74 × 11.8 = <b>−13.93</b></p>${F("الخط الناتج","y = −13.93 + 3.74x")}<p>كل سنة تعليم إضافية بتزود الدخل حوالي 3.74 وحدة.</p><h2>عمر العربية مقابل السرعة (13 عربية)</h2><div class="card">x (العمر) = [5,7,8,7,2,17,2,9,4,11,12,9,6]<br>y (السرعة) = [99,86,87,88,111,86,103,87,94,78,77,85,86]</div><p>Σx = 99, Σy = 1167, SS_x ≈ 209.08, SS_xy ≈ −366.15<br>β1 ≈ <b>−1.75</b>، β0 ≈ <b>103.11</b>، معامل الارتباط r ≈ −0.76</p>${F("الخط الناتج (نفس نتيجة scipy.stats.linregress)","speed = 103.11 − 1.75 · age")}<p>العربيات الأقدم أبطأ: كل سنة عمر إضافية بتقلل السرعة المتوقعة حوالي 1.75. لعربية عمرها 10 سنين التوقع حوالي 85.6. (الشريحة بتطبع std_err تحت اسم "loss"، لكن std_err هو الخطأ المعياري للميل، مش الـ loss.)</p>`,
"3demos":`<h2>ملعب الـ Regression</h2><p>اضغط على اللوحة عشان تضيف نقط. الخط المتصل هو الحل الدقيق بـ Least Squares، والمتقطع هو Gradient Descent وأنت بتتقدم فيه خطوة خطوة.</p><p>α = <b id="lv">0.10</b> <input type="range" id="lr" min="1" max="300" value="10" aria-label="learning rate"> <button class="btn o" id="gs">خطوة ×10</button> <button class="btn o" id="gr">إعادة GD</button> <button class="btn o" id="gc">مسح النقط</button></p><canvas id="lp" width="480" height="320" aria-label="Regression canvas"></canvas><p class="mono" id="gj"></p>`,
"3quiz":QH([["في y = β0 + β1x، إيه معنى β1؟",["المقطع (intercept)","الميل (slope)","الـ residual"],1],["الـ Least Squares بتختار الخط اللي بيقلل...",["مجموع الـ residuals","مجموع مربعات الـ residuals","أكبر residual"],1],["في Gradient Descent، learning rate كبير أوي ممكن...",["يعمل diverge","يتقارب أسرع دايماً","ميعملش حاجة"],0],["ليه بنعمل vectorization بالـ design matrix؟",["كود أقصر وأسرع من الـ loops","بتغيّر النموذج","بتشيل الـ bias"],0]])});
Object.assign(AR,{"4theory":`<h2>الـ Bias والـ Variance</h2><p>الـ <b>Bias</b> هو بُعد متوسط التوقعات عن القيمة الحقيقية. الـ <b>Variance</b> هو مقدار تغيّر التوقعات لما مجموعة التدريب تتغير.</p>
<table class="t"><tr><th>Bias</th><th>Variance</th><th>النتيجة</th></tr><tr><td>Low</td><td>Low</td><td>مثالي</td></tr><tr><td>Low</td><td>High</td><td>Overfitting</td></tr><tr><td>High</td><td>Low</td><td>Underfitting</td></tr><tr><td>High</td><td>High</td><td>أسوأ حالة</td></tr></table>
<h2>الـ Ensembles</h2><p>بنجمع موديلات ضعيفة (weak learners) في موديل أقوى. متوسط موديلات أخطاؤها مش متطابقة بيقلل الـ variance.</p>
<h2>Bagging (bootstrap aggregating)</h2><ol><li>اسحب m مجموعة bootstrap من مجموعة التدريب بالـ replacement.</li><li>درّب موديل على كل مجموعة.</li><li>خد متوسط التوقعات، أو تصويت الأغلبية في الـ classification.</li></ol>
<h2>Random Forests</h2><p>شجر قرار معمول لها bagging، وكل تقسيم فيها بينظر لمجموعة عشوائية من الـ features (feature bagging أو Random Subspace Method). ده بيخلي الشجر أقل تشابهاً، فالتوسيط بيفيد أكتر.</p>
<h2>التحسين (Optimization)</h2><p>الـ Gradient Descent بيكرر wⱼ → wⱼ − α ∂J/∂wⱼ. لو α صغير جداً التقدم بطيء، ولو كبير ممكن يتجاوز النقطة ويعمل diverge.</p>`,
"4formulas":F("Bias","Bias = E[ŷ] − y_true")+F("Variance","Variance = E[(ŷ − E[ŷ])²]")+F("Gradient descent","wⱼ → wⱼ − α ∂J/∂wⱼ")+F("الـ learning rate المعتاد","α ∈ [0.001, 0.1]"),
"4examples":`<h2>Bagging: m = 3 مجموعات، n = 7 أمثلة</h2><p>كل مجموعة بتتكون بسحب 7 أمثلة من الـ 7 الأصلية بالـ replacement، فبعض الأمثلة بتتكرر وبعضها بيبقى بره.</p><div class="card">P(مثال معين ميتسحبش خالص) = (1 − 1/7)⁷ = (6/7)⁷ ≈ <b>0.34</b></div><p>يعني كل مجموعة bootstrap فيها حوالي 66% من الأمثلة الأصلية المختلفة. الـ 3 موديلات بيشوفوا بيانات مختلفة، وأصواتهم بتتجمع.</p><h2>قراءة الحالات الأربعة</h2><p>Low bias مع low variance هو الهدف. Low bias مع high variance يعني الموديل بيلاحق الـ noise. High bias مع low variance يعني مبسط أوي. High bias مع high variance يعني خاطئ وغير مستقر.</p>`,
"4demos":`<h2>مستكشف Polynomial Regression</h2><p>بنعمل fit لكثيرة حدود درجتها M على 10 نقط فيها noise من منحنى منتظم. M = 0 أو 1 بيعمل underfit (bias عالي)، وM = 9 بيمر بكل النقط لكن بيتموّج (variance عالي).</p><p>M = <b id="pmv">3</b> <input type="range" id="pm" min="0" max="9" value="3" aria-label="degree M"></p><canvas id="pd" width="480" height="320" aria-label="Polynomial fit"></canvas><p class="mono" id="pe"></p><h2>تجربة Bagging</h2><p>سبع أمثلة ليها labels (0,0,1,1,1,0,1). كل من الـ 3 موديلات بيتدرب على bootstrap sample ويتوقع الـ label الأكثر تكراراً، والـ ensemble بيعمل تصويت.</p><p><button class="btn o" id="bg">اسحب عينات جديدة</button></p><pre class="out" id="bgo"></pre>`,
"4quiz":QH([["موديل low bias وhigh variance يبقى...",["Overfitting","Underfitting","مثالي"],0],["إيه اللي بيعمله الـ bagging؟",["بيدرب موديلات على bootstrap samples ويجمع متوسطها","بيشيل features","بيزود الـ learning rate"],0],["إيه العشوائية الإضافية اللي بتضيفها Random Forests للـ bagging؟",["labels عشوائية","مجموعة features عشوائية عند كل تقسيم","k عشوائي"],1],["أنهي learning rate في المدى الآمن المعتاد؟",["0.05","50","5000"],0]])});
Object.assign(AR,{"5theory":`<h2>الـ Convexity</h2><p>المجموعة convex لو القطعة المستقيمة بين أي نقطتين منها تفضل جوها. والدالة convex لو القطعة بين نقطتين على الرسم تفضل فوق الرسم أو عليه. في الـ costs الـ convex أي local minimum هو global minimum، فالـ gradient descent مايقدرش يعلق في نقطة سيئة.</p>
<h2>التصنيف الخطي الثنائي</h2><p>نحسب z = wᵀx + b ونتوقع 1 لو z ≥ 0، غير كده 0. الحد wᵀx + b = 0 هو خط (أو hyperplane). ممكن ندمج الـ b في w بإضافة مدخل ثابت 1، ونكتبه w₀.</p>
<h2>الـ Logistic Regression</h2><p>بنضغط z بالـ sigmoid عشان الناتج يبقى احتمال بين 0 و1، وبندرب بـ cross-entropy loss. الأنواع: <b>Binomial</b> (كلاسين)، <b>Multinomial</b> (كلاسات كتير من غير ترتيب)، <b>Ordinal</b> (كلاسات مرتبة).</p>
<h2>Data space مقابل Weight space</h2><p>في الـ data space كل نقطة مثال والحد خط. في الـ weight space كل نقطة هي متجه أوزان، وكل مثال بيتحول لقيد (half-space) عليها.</p>`,
"5formulas":F("Convexity","f((1−λ)x₀ + λx₁) ≤ (1−λ)f(x₀) + λf(x₁)")+F("مصنّف خطي","z = wᵀx + b\ny = 1 if z ≥ 0, else 0")+F("Sigmoid","σ(z) = 1 / (1 + e⁻ᶻ)")+F("Cross-entropy","L(y,t) = −t·log(y) − (1−t)·log(1−y)")+F("Gradient","∂J/∂wⱼ = (y − t)·xⱼ"),

(function(){
const kn=(d,q,k)=>d.map(r=>[Math.hypot(r[0]-q[0],r[1]-q[1]),r[2]]).sort((a,b)=>a[0]-b[0]).slice(0,k);
const sc=(d,q,pred,xl,yl)=>{const xs=d.map(r=>r[0]).concat(q[0]),ys=d.map(r=>r[1]).concat(q[1]),a=Math.min(...xs)-1,b=Math.max(...xs)+1,c=Math.min(...ys)-1,e=Math.max(...ys)+1,X=x=>40+(x-a)/(b-a)*300,Y=y=>190-(y-c)/(e-c)*160;
let o=`<path d="M40 190H340M40 190V30" stroke="var(--mut)" fill="none"/>`+d.map(r=>`<circle cx="${X(r[0]).toFixed(1)}" cy="${Y(r[1]).toFixed(1)}" r="5" fill="${r[2]?"#3b82f6":"#ef4444"}"/>`).join("")+`<path d="M${X(q[0])} ${Y(q[1])-9}l9 16h-18z" fill="${pred?"#3b82f6":"#ef4444"}" stroke="var(--tx)" stroke-width="2"/><text x="${X(q[0])}" y="${Y(q[1])+26}" fill="var(--tx)" font-size="11" text-anchor="middle">new point, class ${pred}</text><text x="190" y="214" fill="var(--mut)" font-size="11" text-anchor="middle">${xl}</text><text x="10" y="110" fill="var(--mut)" font-size="11" transform="rotate(-90 10 110)" text-anchor="middle">${yl}</text>`;
return `<div class="vz"><svg viewBox="0 0 360 225" width="360" style="max-width:100%">${o}</svg></div>`};
const ex=()=>{const hx=[167,182,176,173,172,174,169,173,170],hy=[51,62,69,64,65,56,58,57,55],hc=[0,1,1,1,1,0,1,1,1],hd=hx.map((x,i)=>[x,hy[i],hc[i]]),q=[170,55],n=kn(hd,q,3),pr=n.reduce((a,r)=>a+r[1],0)*2>3?1:0;
const bx=[4,5,10,4,3,11,14,9,8,10,12],by=[21,19,24,17,16,25,24,23,22,21,21],bc=[0,0,1,0,0,1,1,1,0,1,1],bd=bx.map((x,i)=>[x,by[i],bc[i]]),n2=kn(bd,[8,21],3),p2=n2.reduce((a,r)=>a+r[1],0)*2>3?1:0;
return `<h2>${lang==="ar"?"مثال KNN: النقطة (8, 21)":"KNN example: the point (8, 21)"}</h2>`+TBL2(["x",...bx],[["y",...by],["class",...bc]])+sc(bd,[8,21],p2,"x","y")+`<p>k = 3: the neighbours' classes are ${n2.map(r=>r[1]).join(", ")}, so the majority vote gives <b>class ${p2}</b>.</p>`+
`<h2>${lang==="ar"?"مثال الطول والوزن":"Height and weight example"}</h2>`+TBL2(["Height (cm)",...hx],[["Weight (kg)",...hy],["Class",...hc]])+sc(hd,q,pr,"height (cm)","weight (kg)")+`<p>The new point (170, 55) with k = 3 has neighbour classes ${n.map(r=>r[1]).join(", ")}, so the prediction is <b>class ${pr}</b>.</p>`};

})();

(function(){
const M2={"Loss and cost":"L(y,t)=\\tfrac12(y-t)^2,\\quad J=\\frac{1}{2N}\\sum_{i=1}^{N}\\big(y^{(i)}-t^{(i)}\\big)^2","Sums of squares":"SS_x=\\sum(x_i-\\bar x)^2,\\quad SS_{xy}=\\sum(x_i-\\bar x)(y_i-\\bar y)","Gradient":"\\frac{\\partial J}{\\partial w_j}=(y-t)\\,x_j","Gradient descent update":"w\\leftarrow w-\\frac{\\alpha}{N}\\sum_{i}\\big(y^{(i)}-t^{(i)}\\big)x^{(i)}","Nearest neighbor":"x^*=\\arg\\min_{x^{(i)}}\\ \\mathrm{distance}(x^{(i)},x)","Majority vote":"y^*=\\arg\\max_{t}\\sum_{i\\in N_k(x)}\\mathbb 1\\big[t^{(i)}=t\\big]","Typical learning rate":"\\alpha\\in[0.001,\\,0.1]"};
M2["Loss وCost"]=M2["Loss and cost"];M2["مجاميع المربعات"]=M2["Sums of squares"];M2["تحديث Gradient Descent"]=M2["Gradient descent update"];M2["أقرب نقطة"]=M2["Nearest neighbor"];M2["التصويت بالأغلبية"]=M2["Majority vote"];M2["الـ learning rate المعتاد"]=M2["Typical learning rate"];
M2["الميل والمقطع"]="\\beta_1=\\frac{SS_{xy}}{SS_x},\\quad \\beta_0=\\bar y-\\beta_1\\bar x";M2["النموذج"]="Y=\\beta_0+\\beta_1 X";M2["مصنّف خطي"]="z=w^\\top x+b,\\quad y=\\mathbb 1[z\\ge 0]";

<div class="card">💡 <b>${T2("Key idea","الفكرة الأساسية")}:</b> ${T2("here x = years of education and y = income. We want the line y = β₀ + β₁x that minimizes the squared errors.","هنا x = سنين التعليم وy = الدخل. عايزين الخط y = β₀ + β₁x اللي بيقلل مجموع مربعات الأخطاء.")}</div>`;

["1",T2("Sums: Σx, Σx², Σy, Σxy","نحسب المجاميع: Σx, Σx², Σy, Σxy"),"118, 1450, 302, 3779"],
["2","SS_x = 1450 − 118²/10","57.6"],
["3","SS_xy = 3779 − (118)(302)/10","215.4"],
["4","β₁ = 215.4 / 57.6","3.74"],
["5","β₀ = 30.2 − 3.74 × 11.8","−13.93"],
["6",T2("Final line","المعادلة النهائية"),"y = −13.93 + 3.74x"]])
